name: CI

on:
  push:
    branches: [master, main, "v*-fixed"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Confirm executable JAR
        shell: bash
        run: |
          test -n "$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print -quit)"
          ls -lh target/*.jar
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: o365-${{ github.sha }}
          path: |
            target/*.jar
            !target/*.jar.original
          if-no-files-found: error
          retention-days: 14
